plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.sid.fiveberinspector'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.sid.fiveberinspector'
        minSdk 28
        targetSdk 36
        versionCode 55
        versionName '0.20.0-beta.7'
        manifestPlaceholders = [glitchtipDsn: providers.gradleProperty('glitchtipDsn').orElse('').get()]
    }

    bundle { language { enableSplit = false } }

    buildFeatures {
        aidl true
        buildConfig true
    }

    // Stable internal signing identity: never silently generate a new key for upgrades.
    def labDebugKey = providers.gradleProperty('fiveberDebugKeystore')
        .orElse(providers.environmentVariable('FIVEBER_DEBUG_KEYSTORE'))
        .orElse(System.getProperty('user.home') + '/.config/.android/debug.keystore')
    signingConfigs {
        debug {
            storeFile file(labDebugKey.get())
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Production credentials are supplied by the release owner. Never create a key.
        def releaseNames = ['FIVEBER_RELEASE_KEYSTORE', 'FIVEBER_RELEASE_STORE_PASSWORD',
                            'FIVEBER_RELEASE_KEY_ALIAS', 'FIVEBER_RELEASE_KEY_PASSWORD']
        def supplied = releaseNames.collect { providers.environmentVariable(it).orNull }
        if (supplied.any { it != null }) {
            if (supplied.any { it == null || it.isEmpty() })
                throw new GradleException('All four production signing inputs must be supplied together')
            release {
                storeFile file(supplied[0])
                storePassword supplied[1]
                keyAlias supplied[2]
                keyPassword supplied[3]
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            debuggable false
            ndk { abiFilters 'arm64-v8a' }
            if (signingConfigs.findByName('release') != null) signingConfig signingConfigs.release
        }
        // Explicit test-only variant. Built only on an authorized lab device,
        // and never included by main/release CI or publication workflows.
        lab {
            initWith release
            signingConfig signingConfigs.debug
            debuggable true
            matchingFallbacks = ['release']
        }
    }

    sourceSets {
        release {
            jniLibs.srcDirs += ['build/releaseJniLibs']
            assets.srcDirs += ['build/releaseAdbAssets']
        }
        lab {
            java.srcDirs += ['src/release/java']
            jniLibs.srcDirs += ['build/labJniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { keepDebugSymbols += ['**/libeuicc-drivers.so'] }
        resources {
            merges += ['META-INF/NOTICE', 'META-INF/LICENSE']
        }
    }
}

dependencies {
    implementation 'io.sentry:sentry-android-core:8.61.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation files('libs/zxing-core-3.5.3.jar')
}

// Lock all resolvable configurations; checksums are verified independently.
dependencyLocking { lockAllConfigurations() }
